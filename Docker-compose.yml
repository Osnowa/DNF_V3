services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${Puser}
      POSTGRES_PASSWORD: ${Ppassword}
      POSTGRES_DB: ${Pdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      - postgres
    
    env_file:
      - .env


volumes:
  postgres_data:
